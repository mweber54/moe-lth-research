seed: 7
device: auto
data:
  path: null
  seq_len: 64
  train_fraction: 0.9
  validation_blocks: 32
model:
  vocab_size: 256
  num_layers: 4
  num_heads: 4
  d_model: 256
  num_experts: 8
  expert_hidden_size: 1024
  dropout: 0.0
  top_k: 1
  capacity_factor: 1.25
routing:
  mode: learned
  aux_loss_weight: 0.01
training:
  steps: 50000
  batch_size: 8
  learning_rate: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  eval_interval: 1000
  log_interval: 100
  checkpoint_steps: [0, 1000, 5000, 10000, 25000, 50000]
  save_optimizer: true
  record_train_routes: true
pruning:
  sparsities: [0.5, 0.7, 0.8, 0.9, 0.95]
  rewind_fractions: [0.0, 0.01, 0.05, 0.1]
output_dir: results/runs/baseline

