seed: 7
device: cpu
data:
  path: null
  seq_len: 8
  train_fraction: 0.9
  validation_blocks: 1
  reshuffle_each_epoch: false
model:
  vocab_size: 256
  num_layers: 1
  num_heads: 2
  d_model: 16
  num_experts: 2
  expert_hidden_size: 32
  dropout: 0.0
  top_k: 1
  capacity_factor: 1.25
routing:
  mode: learned
  aux_loss_weight: 0.01
training:
  steps: 3
  batch_size: 2
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  eval_interval: 1
  log_interval: 1
  checkpoint_steps: [0, 1, 3]
  save_optimizer: false
  record_train_routes: true
pruning:
  sparsities: [0.5, 0.8]
  rewind_fractions: [0.0, 0.1]
output_dir: results/smoke

