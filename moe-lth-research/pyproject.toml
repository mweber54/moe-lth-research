[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moe-lth"
version = "0.1.0"
description = "Routing-conditioned lottery-ticket experiments for small MoE language models"
requires-python = ">=3.10"
dependencies = [
  "datasets",
  "matplotlib",
  "numpy",
  "pyyaml",
  "scikit-learn",
  "torch",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
moe-lth-train = "moe_lth.training.train:main"
moe-lth-suite = "moe_lth.experiments.run_suite:main"
moe-lth-analyze = "moe_lth.experiments.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
