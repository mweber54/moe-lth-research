revision_experiments:

  # --- P0.1: Compute-Matched Rewind ---
  - id: "p01_compute_matched_rewind_wikitext"
    question: "Does the rewind result hold under compute-matched training budget?"
    manipulated: "rewind protocol (full_budget vs compute_matched)"
    controlled: "initialization, routing, data order, architecture, masks"
    seeds: [7, 17, 29]
    dataset: "wikitext103_subset"
    architecture: "configs/wikitext103_gpu.yaml"
    routing_condition: "learned"
    sparsity: [0.5, 0.8]
    rewind_point: [0.0, 0.01, 0.05, 0.1]
    training_budget: 2500
    rewind_protocol: "both"
    conditions:
      - "learned_magnitude_mask"
      - "matched_random_mask"
      - "learned_mask_random_reinit"
      - "dense_reference"
    output_paths:
      base: "results/revision/p01_compute_matched_rewind/wikitext103"
    expected_metrics: [loss, perplexity, mask_advantage, protocol_comparison]
    status: "IMPLEMENTED"
    trace_schema_version: 1
    figure_table: ["fig2_revised", "table_compute_matched"]

  - id: "p01_compute_matched_rewind_tinystories"
    question: "Does the compute-matched rewind result replicate on TinyStories?"
    manipulated: "rewind protocol"
    controlled: "initialization, routing, data order, architecture, masks"
    seeds: [7, 17, 29]
    dataset: "tinystories_50k"
    architecture: "configs/tinystories_gpu.yaml"
    routing_condition: "learned"
    sparsity: [0.5, 0.8]
    rewind_point: [0.0, 0.01, 0.05, 0.1]
    training_budget: 2500
    rewind_protocol: "both"
    conditions:
      - "learned_magnitude_mask"
      - "matched_random_mask"
      - "learned_mask_random_reinit"
      - "dense_reference"
    output_paths:
      base: "results/revision/p01_compute_matched_rewind/tinystories"
    expected_metrics: [loss, perplexity, mask_advantage, protocol_comparison]
    status: "IMPLEMENTED"
    trace_schema_version: 1
    figure_table: ["fig2_revised", "table_compute_matched"]

