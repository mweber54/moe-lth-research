# Canonical Experiment Registry for ICLR 2027 Revision
# This file is the single source of truth for all manuscript figures/tables.
#
# Each experiment has:
#   - id: unique identifier
#   - question: scientific question
#   - manipulated: what variable is changed
#   - controlled: what is held fixed
#   - seeds: list of random seeds
#   - dataset: dataset identifier
#   - architecture: model config reference
#   - routing_condition: which routing mode
#   - sparsity: pruning sparsity levels
#   - rewind_point: rewind fractions
#   - training_budget: total training steps
#   - output_paths: where results are stored
#   - expected_metrics: what metrics to report
#   - status: DONE | IMPLEMENTED | RUNNING | BLOCKED | NOT_STARTED
#   - trace_schema_version: 1 (legacy) or 2 (rich)
#   - rewind_protocol: full_budget_restart | compute_matched | both
#   - figure_table: which manuscript figure/table uses this

schema_version: 1
revision: "iclr_2027_r1"

# =============================================================================
# EXISTING EXPERIMENTS (from original submission)
# =============================================================================

existing_experiments:

  - id: "wikitext103_learned_baseline"
    question: "What is the dense baseline performance with learned routing on WikiText-103?"
    manipulated: "none (baseline)"
    controlled: "initialization, data order, architecture"
    seeds: [7, 17, 29]
    dataset: "wikitext103_subset"
    architecture: "configs/wikitext103_gpu.yaml"
    routing_condition: "learned"
    sparsity: [0.5, 0.7, 0.8, 0.9, 0.95]
    rewind_point: [0.0, 0.01, 0.05, 0.1]
    training_budget: 2500
    output_paths:
      seed7: "results/wikitext103_gpu_suite"
      seed17: "results/wikitext103_gpu_seed17_suite"
      seed29: "results/wikitext103_gpu_seed29_suite"
    expected_metrics: [loss, perplexity, mask_jaccard, expert_usage, route_agreement]
    status: "DONE"
    trace_schema_version: 1
    rewind_protocol: "full_budget_restart"
    figure_table: ["fig2a", "fig2b", "fig3a"]

  - id: "tinystories_learned_baseline"
    question: "What is the dense baseline performance with learned routing on TinyStories?"
    manipulated: "none (baseline)"
    controlled: "initialization, data order, architecture"
    seeds: [7, 17, 29]
    dataset: "tinystories_50k"
    architecture: "configs/tinystories_gpu.yaml"
    routing_condition: "learned"
    sparsity: [0.5, 0.7, 0.8, 0.9, 0.95]
    rewind_point: [0.0, 0.01, 0.05, 0.1]
    training_budget: 2500
    output_paths:
      seed7: "results/tinystories_gpu_suite"
      seed17: "results/tinystories_gpu_seed17_suite"
      seed29: "results/tinystories_gpu_seed29_suite"
    expected_metrics: [loss, perplexity, mask_jaccard, expert_usage, route_agreement]
    status: "DONE"
    trace_schema_version: 1
    rewind_protocol: "full_budget_restart"
    figure_table: ["fig2a", "fig2b", "fig3a"]

  - id: "wikitext103_cross_init_replay"
    question: "Does imposing source routing on target initialization reproduce sparse support?"
    manipulated: "initialization (different seed)"
    controlled: "routing trajectory, data order, architecture"
    seeds:
      source: [7]
      target: [17, 29]
    dataset: "wikitext103_subset"
    architecture: "configs/wikitext103_gpu.yaml"
    routing_condition: "replay"
    sparsity: [0.5, 0.8]
    rewind_point: [0.0, 0.05, 0.1]
    training_budget: 2500
    output_paths:
      base: "results/wikitext103_cross_init_replay"
    expected_metrics: [loss, mask_jaccard, route_agreement, aligned_jaccard]
    status: "DONE"
    trace_schema_version: 1
    rewind_protocol: "full_budget_restart"
    figure_table: ["fig3c"]
    notes: "n=2 targets only - needs replication per P0.4"

  - id: "wikitext103_expert_transfer_limited"
    question: "Does expert 0 mask transfer to expert 1?"
    manipulated: "which expert's mask is applied"
    controlled: "sparsity, architecture, training"
    seeds: [7, 17, 29]
    dataset: "wikitext103_subset"
    architecture: "configs/wikitext103_gpu.yaml"
    routing_condition: "learned"
    sparsity: [0.5, 0.7, 0.8, 0.9, 0.95]
    training_budget: 2500
    output_paths:
      base: "results/wikitext103_gpu_suite"
    expected_metrics: [loss_with_own_mask, loss_with_other_expert_mask]
    status: "DONE"
    trace_schema_version: 1
    figure_table: ["table_expert_transfer"]
    notes: "Only expert 0->1 transfer tested. Needs full matrix per P0.6"

# =============================================================================
# NEW EXPERIMENTS (ICLR revision)
