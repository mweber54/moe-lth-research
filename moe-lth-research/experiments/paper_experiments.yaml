      - expert_utilization
      - accepted_counts
      - dropped_fraction
      - gate_distribution_distance
      - route_agreement
      - mask_jaccard
      - magnitude_pruning_loss
      - random_mask_pruning_loss
      - mask_advantage
      - rewind_performance
    status: "IMPLEMENTED"
    trace_schema_version: 2
    figure_table: ["fig3a_revised"]

  # --- P0.3: Graded Routing Corruption ---
  - id: "p03_graded_corruption_wikitext"
